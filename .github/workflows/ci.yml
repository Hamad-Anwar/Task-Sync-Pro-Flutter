name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # sqflite_common_ffi (testes do banco local) carrega a libsqlite3 do sistema
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting of changed Dart files
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}" -- '*.dart' || true)
          if [ -n "$files" ]; then
            echo "$files" | tr '\n' '\0' | xargs -0 dart format --output=none --set-exit-if-changed
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
